[project]
name = "mavcli"
version = "0.1.0"
description = "Maverick AI - A fully local, personality-customizable voice assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=0.9.0",
    "ollama>=0.1.0",
    "piper-tts>=1.0.0",
    "sounddevice>=0.4.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "requests>=2.25.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mavcli = "mavcli.cli.main:main"

[tool.uv]
package = true
